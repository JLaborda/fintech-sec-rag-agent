[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-signals"
version = "0.1.0"
description = "Phase-1 SEC 10-K qualitative signal generator (AWS-native)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "typer>=0.12",
  "pyarrow>=15",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "moto[s3]>=5.0",
]

[project.scripts]
sec-signals = "sec_signals.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm_judge: LLM-as-judge golden set (CI gated on RAG changes)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
