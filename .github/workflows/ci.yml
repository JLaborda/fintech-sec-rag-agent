name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Contract + unit tests
        run: pytest tests/contract tests/unit -q
      - name: Detect RAG surface changes
        id: rag
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD | \
            grep -E 'src/sec_signals/(retrieve|extract|validate|warehouse|pipeline)/|prompts|contracts/signal-emission|factor' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: LLM-as-judge golden set
        if: steps.rag.outputs.changed == 'true'
        env:
          RUN_LLM_JUDGE: "1"
        run: pytest tests/golden -q -m llm_judge
